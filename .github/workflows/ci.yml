name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow's token only reads the repository: no job here pushes,
# comments or publishes. A job that needs more asks for it itself.
permissions:
  contents: read

# Actions are pinned to a commit, not a tag: a tag can be moved to other
# code, a commit can't. The comment beside each is the release it is.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          ["@mango/marketplace", "@mango/platform", "@mango/core", "@mango/db"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck -w ${{ matrix.workspace }} --if-present
      - name: Lint
        run: npm run lint -w ${{ matrix.workspace }} --if-present
      - name: Unit tests
        run: npm run test -w ${{ matrix.workspace }} --if-present

  # Platform tests that need a database: tenant isolation (RLS) and the
  # Playwright click-through, against a throwaway local Supabase with every
  # migration applied. Nothing here touches staging or live.
  platform-db:
    name: "@mango/platform: RLS + Playwright"
    runs-on: ubuntu-latest
    env:
      # Throwaway password for this run's demo users.
      DEMO_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3 (the v1 branch, 19 Nov 2026)
        with:
          version: 2.121.0
      - run: npm ci
      - name: Start Supabase (applies all migrations and supabase/seed.sql)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
      - name: Write apps/platform/.env.local for the local stack
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > apps/platform/.env.local
      - name: RLS and team tests
        run: npm run test:db -w @mango/platform
      - name: Demo seed
        run: npm run seed -w @mango/platform
      - name: Install Playwright's Chromium
        # --with-deps adds system packages (mostly fonts) from Ubuntu's servers.
        # When those can't be reached (11 Nov 2026: hours of failed lookups
        # from the runners), carry on with what the runner image already has.
        run: npx playwright install --with-deps chromium || npx playwright install chromium
        working-directory: apps/platform
      - name: Playwright (phone and desktop)
        run: npm run test:e2e -w @mango/platform
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: platform-playwright
          path: apps/platform/test-results
          retention-days: 7
