<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order screen prototype</title>
<!--
  Design prototype for docs/phase-3-plan.md §9 and §9.1 (Phase 3 stage 9).
  One self-contained file: no external requests, no framework, nothing saved.
  Sample data is made up (customers, plates); prices are in Thai baht, VAT 7% included.
  Open questions it raises: docs/design/README.md.
-->
<style>
:root {
  /* Tokens copied from apps/platform/app/globals.css (light). */
  --background: #f4f4f5; --foreground: #18181b;
  --card: #ffffff; --muted: #f4f4f5; --muted-foreground: #52525b;
  --primary: #c2410c; --primary-foreground: #ffffff; --primary-text: #c2410c;
  --highlight: #fff7ed; --highlight-foreground: #9a3412; --highlight-border: #fdba74;
  --destructive: #dc2626; --destructive-soft: #fef2f2;
  --border: #e4e4e7; --input: #d4d4d8; --ring: #c2410c;
  --leaf: #336600; --leaf-soft: #f0f7e6;
  --info: #1d4ed8; --info-soft: #eff6ff;
  --group-alt: #ececee;
  --radius: 0.625rem;
  --shadow: 0 10px 30px rgb(0 0 0 / 0.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: #141416; --foreground: #f4f4f5;
    --card: #1e1e21; --muted: #2a2a2e; --muted-foreground: #a1a1aa;
    --primary: #c2410c; --primary-foreground: #ffffff; --primary-text: #fb923c;
    --highlight: #3b2516; --highlight-foreground: #fdba74; --highlight-border: #9a3412;
    --destructive: #f87171; --destructive-soft: #3a1a1a;
    --border: #303035; --input: #3f3f46; --ring: #fb923c;
    --leaf: #a3d977; --leaf-soft: #1f2d12;
    --info: #93c5fd; --info-soft: #172338;
    --group-alt: #2b2b30;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; }
h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: 0.95rem; font-weight: 600; }
.muted { color: var(--muted-foreground); }
.small { font-size: 0.8rem; }
.tnum { font-variant-numeric: tabular-nums; }
.strike { text-decoration: line-through; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }

/* ---------- prototype bar ---------- */
.proto {
  position: sticky; top: 0; z-index: 50; background: #18181b; color: #f4f4f5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 16px;
}
.proto b { font-weight: 600; }
.proto .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.proto .tabs button {
  border: 1px solid #3f3f46; background: transparent; color: #e4e4e7; border-radius: 999px;
  padding: 4px 12px; cursor: pointer;
}
.proto .tabs button[aria-selected="true"] { background: #c2410c; border-color: #c2410c; color: #fff; }
.proto .spacer { flex: 1; }
.proto .note { font-size: 0.78rem; color: #a1a1aa; }
.proto .reset { border: 1px solid #52525b; background: transparent; color: #e4e4e7; border-radius: 8px; padding: 3px 10px; cursor: pointer; }

/* ---------- buttons, chips, inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid transparent;
  background: var(--primary); color: var(--primary-foreground); font-weight: 500; cursor: pointer;
  white-space: nowrap;
}
.btn:hover { filter: brightness(0.92); }
.btn.outline { background: var(--card); color: var(--foreground); border-color: var(--border); }
.btn.outline:hover { background: var(--muted); filter: none; }
.btn.ghost { background: transparent; color: var(--foreground); }
.btn.ghost:hover { background: var(--muted); filter: none; }
.btn.danger { background: var(--destructive-soft); color: var(--destructive); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 0.8rem; border-radius: 7px; }
.btn.icon { width: 34px; padding: 0; }
.btn.sm.icon { width: 28px; }
.btn[disabled] { opacity: 0.5; pointer-events: none; }
.link { background: none; border: 0; padding: 0; color: var(--primary-text); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px;
  font-size: 0.75rem; font-weight: 500; background: var(--muted); color: var(--muted-foreground);
  border: 1px solid var(--border); white-space: nowrap;
}
.chip.hl { background: var(--highlight); color: var(--highlight-foreground); border-color: var(--highlight-border); }
.chip.ok { background: var(--leaf-soft); color: var(--leaf); border-color: transparent; }
.chip.bad { background: var(--destructive-soft); color: var(--destructive); border-color: transparent; }
.chip.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.chip.plate { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--card); color: var(--foreground); }
input[type=text], input[type=date], input[type=number], input[type=search], select, textarea {
  height: 34px; border: 1px solid var(--input); border-radius: 8px; background: var(--card); padding: 0 8px; min-width: 0;
}
textarea { height: auto; padding: 8px; width: 100%; resize: vertical; }
input.money { width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
.dt { display: inline-flex; gap: 4px; }
.dt input[type=date] { width: 136px; }
.dt select { width: 80px; }
label.f { display: block; font-size: 0.75rem; color: var(--muted-foreground); margin-bottom: 2px; }

/* ---------- app shell (same structure as apps/platform/app/[tenant]/layout.tsx) ---------- */
.appwrap { container-type: inline-size; container-name: app; position: relative; }
.app { display: grid; grid-template-columns: 15rem minmax(0, 1fr); min-height: calc(100vh - 46px); }
.side { position: sticky; top: 46px; align-self: start; height: calc(100vh - 46px); background: var(--card); border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 22px; }
.side .shop { padding: 0 10px; font-size: 1.05rem; font-weight: 600; }
.side .grp { display: flex; flex-direction: column; gap: 2px; }
.side .grp p { margin: 0 0 4px; padding: 0 10px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-foreground); font-weight: 500; }
.nav { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--foreground); text-decoration: none; }
.nav svg { width: 18px; height: 18px; color: var(--muted-foreground); }
.nav.on { background: var(--highlight); color: var(--highlight-foreground); font-weight: 500; }
.nav.on svg { color: var(--primary-text); }
@media (max-width: 700px) { .proto { position: static; } .proto .note { display: none; } }
.mhead { display: none; position: relative; z-index: 20; height: 52px; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--card); border-bottom: 1px solid var(--border); font-weight: 600; }
.tabbar { display: none; position: sticky; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--border); padding: 4px 4px 6px; }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem; color: var(--muted-foreground); text-decoration: none; padding: 4px 0; }
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a.on { color: var(--primary-text); font-weight: 600; }
.content { padding: 24px; min-width: 0; }

/* ---------- order layout (invoice style, §9.1) ---------- */
.ohead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.ohead .crumb { font-size: 0.8rem; color: var(--muted-foreground); margin-bottom: 2px; }
.ohead .title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ohead .acts { display: flex; flex-wrap: wrap; gap: 8px; position: relative; }
.ogrid {
  display: grid; gap: 16px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 19rem;
  grid-template-areas: "cust where side" "lines lines side" "gap totals side";
  align-items: start;
}
.a-cust { grid-area: cust; } .a-where { grid-area: where; } .a-lines { grid-area: lines; }
.a-totals { grid-area: totals; } .a-side { grid-area: side; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.card > h2 { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.kv dt { color: var(--muted-foreground); }
.kv dd { margin: 0; }

/* lines */
.search { position: relative; margin-bottom: 12px; }
.search input { width: 100%; padding-left: 32px; height: 38px; }
.search svg { position: absolute; left: 10px; top: 11px; width: 16px; height: 16px; color: var(--muted-foreground); }
.results { position: absolute; z-index: 15; left: 0; right: 0; top: 42px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); max-height: 340px; overflow: auto; }
.results button { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; background: none; border: 0; padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
.results button:hover, .results button:focus-visible { background: var(--highlight); }
.lhead, .line { display: grid; grid-template-columns: 18px minmax(0, 1.3fr) minmax(232px, 2fr) minmax(0, 1.1fr) 6.5rem 30px; gap: 10px; align-items: start; }
.lhead { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground); padding: 0 4px 6px; border-bottom: 1px solid var(--border); }
.line { padding: 12px 4px; border-bottom: 1px solid var(--border); }
.rental { border-bottom: 1px solid var(--border); }
.rental > .line { border-bottom: 0; }
.handle { color: var(--input); cursor: grab; user-select: none; padding-top: 6px; letter-spacing: -2px; }
.pname { font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.lmeta { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ldates { display: flex; flex-wrap: wrap; gap: 8px 12px; }
.lprice { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.ltotal { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; padding-top: 6px; }
.lx { padding-top: 3px; }
.sub { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto 7.5rem 30px; gap: 10px; align-items: center; padding: 6px 4px; font-size: 0.85rem; }
.sub .lbl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-left: 14px; border-left: 2px solid var(--border); }
.sub .amt { text-align: right; font-variant-numeric: tabular-nums; }
.sub.closed { color: var(--muted-foreground); }
.sub.credit .amt { color: var(--leaf); }
.subwrap { padding-bottom: 8px; }
.ractions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 4px 0; }
.free { font-size: 0.75rem; }
.free.low { color: var(--destructive); }
.reason select { height: 28px; font-size: 0.78rem; }

/* totals */
.tot { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-variant-numeric: tabular-nums; }
.tot .r { text-align: right; }
.tot .sep { grid-column: 1 / -1; border-top: 1px solid var(--border); margin: 4px 0; }
.tot .big { font-size: 1.15rem; font-weight: 700; }
.deposit { margin-top: 14px; border: 1px dashed var(--highlight-border); background: var(--highlight); color: var(--highlight-foreground); border-radius: 10px; padding: 10px 12px; }
.deposit b { color: var(--foreground); }
.sched { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
.sched .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }

/* sidebar */
.pay { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
.pay:first-of-type { border-top: 0; }
.bal { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
.bal .big { font-size: 1.35rem; font-weight: 700; }
.hist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 0.82rem; }
.hist li { display: grid; grid-template-columns: 5.2rem 1fr; gap: 8px; }
.dep { padding: 8px 0; border-top: 1px solid var(--border); }
.dep:first-of-type { border-top: 0; padding-top: 0; }
.steps { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; }
.steps .arrow { color: var(--muted-foreground); font-size: 0.8rem; }
.custcard .name { font-size: 1.05rem; font-weight: 600; }
.custpick { position: relative; }
.custpick input { width: 100%; }
.later { opacity: 0.7; }
.planned { font-size: 0.72rem; border-radius: 999px; padding: 1px 8px; background: var(--muted); color: var(--muted-foreground); }

/* menus, modals, toast */
.menu { position: absolute; right: 0; top: 40px; z-index: 30; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); min-width: 220px; padding: 4px; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
.menu button:hover { background: var(--muted); }
.menu button[disabled] { color: var(--muted-foreground); cursor: not-allowed; }
.menu .why { display: block; font-size: 0.72rem; color: var(--muted-foreground); }
.overlay { position: fixed; inset: 0; z-index: 60; background: rgb(0 0 0 / 0.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.phoneframe .overlay { position: absolute; align-items: flex-end; padding: 0; }
.dialog { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 20px; }
.phoneframe .dialog { border-radius: 16px 16px 0 0; max-height: 88%; }
.dialog h2 { font-size: 1.1rem; margin-bottom: 4px; }
.dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border: 1px solid var(--border); border-radius: 10px; margin-top: 8px; cursor: pointer; }
.opt.on { border-color: var(--primary); background: var(--highlight); }
.opt input { margin-top: 3px; }
.opt .amt { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.callout { border-radius: 10px; padding: 10px 12px; background: var(--muted); font-size: 0.85rem; margin-top: 12px; }
.callout.hl { background: var(--highlight); color: var(--highlight-foreground); }
.callout.ok { background: var(--leaf-soft); color: var(--leaf); }
.callout.bad { background: var(--destructive-soft); color: var(--destructive); }
.proto-ctl { margin-top: 12px; border: 1px dashed var(--input); border-radius: 10px; padding: 8px 10px; font-size: 0.8rem; }
.proto-ctl summary { cursor: pointer; color: var(--muted-foreground); }
.math { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.75rem; white-space: pre-wrap; color: var(--muted-foreground); margin-top: 6px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 90; background: #18181b; color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); display: none; }

/* ---------- phone tab ---------- */
.phones { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; padding: 24px 16px 40px; }
.phonecol { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.phoneframe { width: 395px; max-width: 100%; height: 760px; border: 10px solid #27272a; border-radius: 36px; overflow: hidden; position: relative; background: var(--background); }
.phonescroll { height: 100%; overflow: auto; scrollbar-width: none; }
.phonescroll::-webkit-scrollbar { display: none; }
.phoneframe .app { min-height: 100%; }

/* ---------- narrow: the same sections stack (§9.1 difference 6) ---------- */
@container app (max-width: 1080px) {
  .ogrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "cust where" "lines lines" "totals totals" "side side"; }
}
@container app (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); display: flex; flex-direction: column; }
  .side { display: none; }
  .mhead { display: flex; }
  .tabbar { display: flex; }
  .content { padding: 14px 12px 20px; flex: 1; }
  h1 { font-size: 1.25rem; }
  .ohead { align-items: stretch; }
  .ohead .acts { width: 100%; }
  .ohead .acts .btn.main { flex: 1; }
  .ogrid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "cust" "where" "lines" "totals" "side"; gap: 12px; }
  .card { padding: 14px 12px; }
  .results { max-height: 300px; }
}
/* the line table restacks on the lines card's own width */
.a-lines { container-type: inline-size; container-name: lines; }
@container lines (max-width: 700px) {
  .lhead { display: none; }
  .line { grid-template-columns: 14px minmax(0, 1fr) auto; grid-template-areas: "h prod x" "h dates dates" "h price total"; gap: 8px; }
  .line > .handle { grid-area: h; } .line > .lprod { grid-area: prod; } .line > .ldates { grid-area: dates; }
  .line > .lprice { grid-area: price; } .line > .ltotal { grid-area: total; align-self: end; } .line > .lx { grid-area: x; }
  .sub { grid-template-columns: 0 minmax(0, 1fr) auto auto; grid-template-areas: "h lbl amt x" "h ctl ctl ctl"; gap: 4px 8px; }
  .sub > .handle { display: none; }
  .sub > .lbl { grid-area: lbl; } .sub > .ctl { grid-area: ctl; padding-left: 16px; } .sub > .amt { grid-area: amt; } .sub > .lx { grid-area: x; }
  .ldates .dt input[type=date] { width: 128px; }
}
</style>
</head>
<body>
<div class="proto" role="banner">
  <b>Order screen prototype</b>
  <div class="tabs" role="tablist" id="tabs"></div>
  <span class="spacer"></span>
  <span class="note">Sample data, made up. Nothing is saved. Shop clock fixed at 26 Nov 2026 10:00.</span>
  <button class="reset" data-act="reset" type="button">Reset</button>
</div>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>

  { id: "pcx", name: "Honda PCX 160", kind: "vehicle", d1: 350, d3: 900, w: 1300, tw: 1700, m: 3500, extra: 200, long: 120, dep: 5000, units: ["3คง 7710", "3คง 7711"] },
  { id: "forza", name: "Honda Forza 350", kind: "vehicle", d1: 900, d3: 2400, w: 4500, tw: 7000, m: 12000, extra: 500, long: 400, dep: 10000, units: ["4งจ 0081"] },

  { id: "c2", name: "Siriporn Chaiyasit", phone: "+66 81 234 5678", email: "siriporn@example.com", nat: "Thailand", orders: 1 },
  { id: "c3", name: "James O'Hara", phone: "+44 7700 900123", email: "jamesoh@example.com", nat: "United Kingdom", orders: 0 },
  { id: "c4", name: "Mei Tanaka", phone: "+81 90 1234 5678", email: "mei.t@example.com", nat: "Japan", orders: 2, depositWaived: true },
  { id: "c5", name: "Daniel Moreau", phone: "+33 6 12 34 56 78", email: "d.moreau@example.com", nat: "France", orders: 5 },
];
const COUPONS = {
  LOYAL10: { pct: 10, label: "10% off rentals" },
  MONTH500: { fixed: 50000, label: "฿500 off the first charge" },
};

/* =====================================================================

/* =====================================================================

function listPrice(p, n) { // 30 days or fewer, in satang

  let prev = pts[0];

function periods(p, start, end) {

  const out = []; let a = start; let k = 1;

  if (p.flat != null) return `${money(p.flat * 100)} flat`;
  return `${money(p.price * 100)} each`;
}

/* =====================================================================
   Order maths (stand-in for the ledger: §6.4)
   ===================================================================== */
const liveLines = (o) => o.lines.filter((l) => !l.void);
const chargeTotal = (o, c) => liveLines(o).filter((l) => l.charge === c.id).reduce((t, l) => t + l.amount, 0);
/** Credit is used automatically (Mark, 26 Nov 2026): everything paid, less refunds, plus any charge that is
    a credit, pays the open charges oldest due first. So credit left by a canceled rental or a swap comes off
    the next charge by itself. */
function paidMap(o) {
  const m = new Map();
  let pool = o.payments.reduce((t, p) => t + (p.kind === "payment" ? p.amount : p.kind === "refund" ? -p.amount : 0), 0);
  const cs = o.charges.map((c) => ({ c, t: chargeTotal(o, c) }));
  cs.forEach((x) => { if (x.t < 0) pool += -x.t; });
  cs.filter((x) => x.t > 0).sort((a, b) => P(a.c.due) - P(b.c.due)).forEach((x) => { const take = Math.max(0, Math.min(pool, x.t)); m.set(x.c.id, take); pool -= take; });
  return m;
}
const chargePaid = (o, c) => paidMap(o).get(c.id) || 0;
function chargeState(o, c) {
  const total = chargeTotal(o, c); const paid = chargePaid(o, c);
  if (!liveLines(o).some((l) => l.charge === c.id)) return { tone: "", text: "Canceled", total, paid, open: 0 };
  if (total <= 0) return { tone: "ok", text: total < 0 ? "Credit" : "Nothing to pay", total, paid, open: 0 };
  const open = total - paid;
  const own = o.payments.filter((p) => p.kind === "payment" && p.alloc.some((a) => a.charge === c.id)).pop();
  if (open <= 0) return { tone: "ok", text: own ? "Paid " + fD(own.at) : "Paid from credit", total, paid, open: 0 };
  const left = paid ? ` (${money(open)} left)` : "";
  if (P(c.due) <= P(NOW)) return { tone: "bad", text: (c.due.slice(0, 10) === NOW.slice(0, 10) ? "Due today" : "Due since " + fD(c.due)) + left, total, paid, open };
  return { tone: "info", text: "Due " + fD(c.due) + left, total, paid, open };
}
function orderCalc(o) {
  const lines = liveLines(o);
  const total = lines.reduce((t, l) => t + l.amount, 0);
  const listTotal = lines.reduce((t, l) => t + (l.list ?? l.amount), 0);
  const staff = lines.filter((l) => l.kind !== "coupon" && l.kind !== "credit").reduce((t, l) => t + ((l.list ?? l.amount) - l.amount), 0);
  const coupon = lines.filter((l) => l.kind === "coupon").reduce((t, l) => t + l.amount, 0);
  const credits = lines.filter((l) => l.kind === "credit").reduce((t, l) => t + l.amount, 0);
  const paid = o.payments.reduce((t, p) => t + (p.kind === "payment" ? p.amount : p.kind === "refund" ? -p.amount : 0), 0);

  o.charges.forEach((c) => { const st = chargeState(o, c); if (st.open > 0 && P(c.due) <= P(NOW)) dueOpen += st.open; });
  const dueNow = Math.max(0, Math.min(balance, dueOpen));

}

    const st = chargeState(o, c); if (left <= 0 || st.open <= 0) return;
    const take = Math.min(left, st.open); alloc.push({ charge: c.id, amount: take }); left -= take;

function linePaid(o, l) { // what was actually paid toward one line: its share of what its charge received
  const c = o.charges.find((x) => x.id === l.charge); const st = chargeState(o, c);
  if (st.total <= 0) return 0;
  return rhu((l.amount * Math.min(st.paid, st.total)) / st.total);
}
function orderStatus(o) {
  if (o.canceled) return { text: "Canceled", tone: "bad" };
  const st = o.rentals.filter((r) => r.stage !== "canceled").map((r) => r.stage);
  const n = (s) => st.filter((x) => x === s).length;
  if (!st.length) return { text: "Canceled", tone: "bad" };
  if (n("reserved") === st.length) return { text: "Reserved", tone: "info" };
  if (n("out") === st.length) return { text: "Picked up", tone: "hl" };
  if (n("returned") === st.length) return { text: "Returned", tone: "ok" };
  const parts = [["out", "out"], ["reserved", "reserved"], ["returned", "returned"]].filter(([s]) => n(s)).map(([s, w]) => `${n(s)} ${w}`);
  return { text: "Mixed: " + parts.join(", "), tone: "hl" };
}

  if (!d.amount) return { text: "Not needed", tone: "", steps: [] };
  const steps = ev.map((e) => ({ held: "Held", released: "Released", expired: "Expired", charged: "Charged", refunded: "Refunded", kept: "Kept", topup: "Top-up needed" }[e.type] + " " + fD(e.at) + (e.amount && e.amount !== d.amount ? " · " + money(e.amount) : "")));
  const last = ev.filter((e) => e.type !== "topup").pop();
  const top = ev.filter((e) => e.type === "topup" && !e.done).pop();
  if (!last) return { text: r.stage === "reserved" ? "Required at pickup" : "Required, not taken", tone: r.stage === "reserved" ? "info" : "bad", steps, top };

  });

/* =====================================================================
   Draft maths (the New order screen)
   ===================================================================== */
function draftCalc(d) {
  const groups = new Map();
  const add = (due, it) => { if (!groups.has(due)) groups.set(due, { due, items: [] }); groups.get(due).items.push(it); };
  const rows = []; let deposit = 0;
  const custObj = d.customer && (cust(d.customer) || d.newCust);
  for (const l of d.lines) {
    const p = prod(l.pid);
    if (l.type === "vehicle") {
      const ps = periods(p, l.start, l.end); const r = { line: l, p, periods: [], total: 0 };
      ps.forEach((per, i) => {
        const o = l.over[i]; const charged = o ? o.charged : per.list; const due = i === 0 ? "booking" : per.start;
        const ex = l.extras.map((e) => { const ep = prod(e.pid); return { e, ep, amount: extraAmount(ep, per, e.qty, i === 0) }; }).filter((x) => x.amount > 0);
        r.periods.push({ per, i, charged, list: per.list, due, reason: o && o.reason, ex });
        add(due, { amount: charged, list: per.list, coup: true, what: `${p.name} ${ps.length > 1 ? "month " + (i + 1) : ""}` });
        ex.forEach((x) => add(due, { amount: x.amount, list: x.amount, coup: true, what: x.ep.name }));
        r.total += charged + ex.reduce((t, x) => t + x.amount, 0);
      });
      if (!(custObj && custObj.depositWaived)) deposit += p.dep * 100;
      rows.push(r);
    } else {
      const amt = l.type === "custom" ? l.amount : (p.price ?? p.flat) * 100 * l.qty;
      rows.push({ line: l, p, total: amt });
      add("booking", { amount: amt, list: amt, coup: false, what: l.type === "custom" ? l.text : p.name });
    }
  }
  const c = d.coupon && COUPONS[d.coupon];
  const gs = [...groups.values()].sort((a, b) => (a.due === "booking" ? -1 : b.due === "booking" ? 1 : P(a.due) - P(b.due)));
  gs.forEach((g, gi) => {
    g.sub = g.items.reduce((t, x) => t + x.amount, 0); g.list = g.items.reduce((t, x) => t + x.list, 0);
    const base = g.items.filter((x) => x.coup).reduce((t, x) => t + x.amount, 0);
    g.coupon = 0;
    if (c) { if (c.pct) g.coupon = rhu((base * c.pct) / 100); else if (gi === 0) g.coupon = Math.min(c.fixed, base); } // % on every period, fixed on the first (decision 17)
    g.total = g.sub - g.coupon; g.vat = vatOf(g.total);
  });
  const sum = (k) => gs.reduce((t, g) => t + g[k], 0);
  const total = sum("total"); const vat = vatOf(total);
  return { rows, gs, list: sum("list"), sub: sum("sub"), staff: sum("list") - sum("sub"), coupon: sum("coupon"), total, vat, net: total - vat, deposit, custObj };
}

      <div class="grp"><p>Shop admin</p>${[["products", "Products"], ["fleet", "Fleet"], ["settings", "Shop settings"]].map(([k, l]) => `<a class="nav" href="#" data-act="navnote">${ICON[k]}${l}</a>`).join("")}</div>
    </aside>

function dtPicker(value, data) {
  const step = S.settings.timeStep; const opts = [];
  for (let m = 0; m < 1440; m += step) { const t = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); opts.push(`<option${t === value.slice(11, 16) ? " selected" : ""}>${t}</option>`); }
  return `<span class="dt"><input type="date" value="${value.slice(0, 10)}" data-ch="dt" data-part="date" ${data} aria-label="Date"><select data-ch="dt" data-part="time" ${data} aria-label="Time">${opts.join("")}</select></span>`;
}

function renderCustomerPicker(frame, c) {

function searchBox() {

      <span class="reason"><select data-ch="reason" data-line="${lineId}" data-i="${i}" aria-label="Reason for the price change (optional)"><option value="">No reason (optional)</option>${PRICE_REASONS.map((x) => `<option${x === reason ? " selected" : ""}>${x}</option>`).join("")}</select></span>` : `<span class="small muted">List price</span>`}</div>`;
}
function draftVehicleRow(r, isFirstOfMany) {
  const l = r.line; const p = r.p; const n = days(l.start, l.end);
  const free = freeUnits(p, l.start, l.end, "draft" + l.id);
  const multi = r.periods.length > 1;

  }));

  const extrasRows = (pp) => pp.ex.map((x) => `<div class="sub"><span class="handle"></span><span class="lbl">${esc(x.ep.name)}${x.e.qty > 1 ? " × " + x.e.qty : ""} <span class="small muted">${x.ep.flat != null ? "flat, first charge only" : `${pp.per.days} days`}</span></span>
      <span class="ctl"></span><span class="amt">${money(x.amount)}</span><span class="lx">${pp.i === 0 ? `<button class="btn ghost sm icon" data-act="rm-extra" data-line="${l.id}" data-id="${x.e.id}" aria-label="Remove ${esc(x.ep.name)}">×</button>` : ""}</span></div>`).join("");
  const periodRows = multi ? r.periods.map((pp) => `<div class="sub"><span class="handle"></span>
      <span class="lbl"><b>${pp.per.leftover ? "Extra days" : "Month " + (pp.i + 1)}</b> ${fD(pp.per.start)} → ${fD(pp.per.end)} <span class="chip ${pp.i === 0 ? "hl" : "info"}">${pp.i === 0 ? "Due at booking" : "Due " + fD(pp.per.start)}</span></span>
      <span class="ctl">${priceCell(l.id, pp.i, pp.list, pp.charged, pp.reason)}</span><span class="amt">${money(pp.charged)}</span><span></span></div>${extrasRows(pp)}`).join("") : extrasRows(p0);
  const extraChoices = PRODUCTS.filter((x) => x.kind === "extra" && !l.extras.some((e) => e.pid === x.id));
  return `<div class="rental">
    <div class="line">
      <span class="handle" title="Drag to reorder">⋮⋮</span>
      <div class="lprod"><div class="pname">${esc(p.name)}</div>
        <div class="lmeta"><select data-ch="unit" data-line="${l.id}" style="height:28px;font-size:0.8rem" aria-label="Unit">${unitOpts.join("")}</select>

      <div class="ldates">

        <div class="small muted" style="flex-basis:100%">${n} day${n === 1 ? "" : "s"}${multi ? ` · over 30 days: a line and a charge per month` : ""}${isFirstOfMany ? ` · <button class="link small" data-act="apply-all" data-line="${l.id}">Apply these dates to all lines</button>` : ""}</div>
      </div>

      <div class="ltotal">${money(r.total)}</div>

    </div>

}

function draftTotals(q, sched) {

    : `<span style="grid-column:1/-1;display:flex;gap:6px"><input type="text" placeholder="Coupon code" value="${esc(d.couponIn)}" data-ch="coupon-in" style="flex:1;text-transform:uppercase" aria-label="Coupon code"><button class="btn sm outline" data-act="coupon-apply">Apply</button></span>${d.couponErr ? `<span class="small" style="grid-column:1/-1;color:var(--destructive)">${esc(d.couponErr)}</span>` : `<span class="small muted" style="grid-column:1/-1">Try LOYAL10 or MONTH500</span>`}`;
  return `<div class="tot">
    <span>Subtotal (list prices)</span><span class="r">${money(q.list)}</span>
    ${q.staff ? `<span>Price changes</span><span class="r">−${money(q.staff)}</span>` : ""}

  <div class="deposit"><div style="display:flex;justify-content:space-between;gap:8px"><span>Security deposit</span><b class="tnum">${money(q.deposit)}</b></div>
    <div class="small">Not part of the total and never owed. ${S.settings.depositMode === "hold" ? "Held on the customer's card at pickup" : "Charged at pickup and given back at return"}, once per vehicle.</div></div>`;
}
function draftDeposit(q) {
  const veh = q.rows.filter((r) => r.line.type === "vehicle");
  if (q.custObj && q.custObj.depositWaived) return `<p class="small" style="margin:0"><span class="chip ok">Waived</span> This customer has no deposit to pay.</p>`;
  return `${veh.map((r) => `<div class="dep"><div style="display:flex;justify-content:space-between"><span>${esc(r.p.name)}</span><span class="tnum">${money(r.p.dep * 100)}</span></div><div class="steps"><span class="chip info">Required at pickup</span></div></div>`).join("") || `<p class="small muted" style="margin:0">No vehicles yet.</p>`}
  <details class="proto-ctl"><summary>Prototype control: the shop's deposit setting</summary>
    <label style="display:block;margin-top:6px"><input type="radio" name="depmode" value="hold" data-ch="depmode" ${S.settings.depositMode === "hold" ? "checked" : ""}> Hold on card</label>
    <label style="display:block"><input type="radio" name="depmode" value="charge" data-ch="depmode" ${S.settings.depositMode === "charge" ? "checked" : ""}> Charge (cash, transfer or card)</label>
    <span class="muted">The platform never turns one into the other (decision 37).</span></details>`;
}

/* =====================================================================
   b, c. The order page
   ===================================================================== */
function renderOrder(frame, o) {
  const c = cust(o.customer); const st = orderStatus(o); const m = orderCalc(o);
  const reserved = o.rentals.filter((r) => r.stage === "reserved"); const out = o.rentals.filter((r) => r.stage === "out");
  let main = "";
  if (o.canceled) main = `<button class="btn main outline" data-act="restore" data-o="${o.key}">Restore as draft</button>`;

    const md = S.modal; const o = S.orders[md.o]; const r = o.rentals.find((x) => x.id === md.r); const x = extendCalc(o, r, md);
    const cid = uid("C"); const n = o.charges.filter((c) => c.kind === "extension").length + 1;
    const isMonthly = o.lines.some((l) => l.rental === r.id && /^Month/.test(l.label));
    const label = isMonthly ? "Month " + (o.lines.filter((l) => l.rental === r.id && l.kind === "period" && /^Month/.test(l.label)).length + 1) : "Extension" + (n > 1 ? " " + n : "");
    o.charges.push({ id: cid, kind: "extension", label, due: r.end });
    o.lines.push({ id: uid("l"), charge: cid, rental: r.id, kind: "period", label, start: r.end, end: x.newEnd, pid: r.pid, unit: r.unit, list: x.list, amount: x.amount, reason: x.amount !== x.list ? (md.keep && x.amount === x.kept ? "Kept the last period's discount" : "Changed by staff") : null });
    const helmet = o.lines.find((l) => l.rental === r.id && l.label === "Second helmet");
    if (helmet) { const hp = prod("helmet"); const dd = days(r.end, x.newEnd); const a = Math.min(dd * hp.perDay, hp.cap) * 100; o.lines.push({ id: uid("l"), charge: cid, rental: r.id, kind: "extra", label: "Second helmet", list: a, amount: a }); }
    hist(o, `Extended ${prod(r.pid).name} ${r.unit} from ${fDT(r.end)} to ${fDT(x.newEnd)}: ${money(x.amount)}, due ${fD(r.end)}`);
    r.end = x.newEnd; S.modal = null;
  },
  "swap-ok"(t) {
    const md = S.modal; const o = S.orders[md.o]; const r = o.rentals.find((x) => x.id === md.r); const x = swapCalc(o, r, md); const unit = t.dataset.unit;
    const cid = uid("C"); o.charges.push({ id: cid, kind: "swap", label: "Swap " + fD(NOW), due: NOW });
    x.per.closedAt = NOW; x.per.closedWhy = "swapped";
    let amount = x.amount; let newPeriod; let credit = -x.paidRem;
    if (md.opt === "remainder") newPeriod = md.keep ? x.BremKeep : x.Brem; else newPeriod = x.paidRem + amount;
    if (amount < 0 && md.cheaper === "none") { newPeriod = x.paidRem; amount = 0; }
    o.lines.push({ id: uid("l"), charge: cid, rental: r.id, kind: "period", label: "After swap", start: NOW, end: x.per.end, pid: x.B.id, unit, list: md.opt === "remainder" ? x.Brem : newPeriod, amount: newPeriod, reason: md.opt === "remainder" && md.keep && x.ratio < 1 ? "Kept the customer's discount" : { prorated: "Prorated difference", none: "No charge", manual: "Manual: " + (md.mreason || "") }[md.opt] || null });
    if (x.paidRem) o.lines.push({ id: uid("l"), charge: cid, rental: r.id, kind: "credit", label: `Credit from ${x.A.name}, ${x.rem} unused days`, sub: x.paid >= x.per.amount ? "paid remainder" : "unused part, taken off what is owed", list: credit, amount: credit });
    if (amount < 0 && md.cheaper === "refund") o.payments.push({ id: uid("P"), kind: "refund", at: NOW, method: "Cash", amount: -amount, alloc: [], by: STAFF });
    if (x.depDiff > 0) r.deposit.events.push({ type: "topup", at: NOW, amount: x.depDiff });
    if (x.depDiff) r.deposit.amount = x.B.dep * 100;
    hist(o, `Swapped ${x.A.name} ${r.unit} for ${x.B.name} ${unit} (${{ remainder: "remainder of the period", prorated: "prorated difference", none: "no charge", manual: "manual: " + md.mreason }[md.opt]}): ${money(amount)}${amount < 0 ? " as " + md.cheaper : ""}${md.repair ? "; " + r.unit + " into repair" : ""}${x.depDiff ? `; deposit ${x.depDiff > 0 ? "top-up" : "release"} ${money(Math.abs(x.depDiff))} shown` : ""}`);
    r.repairNote = md.repair ? `Was ${r.unit} (into repair)` : `Was ${r.unit}`;
    r.pid = x.B.id; r.unit = unit; S.modal = null;
  },
  "pickup-ok"() {
    const md = S.modal; const o = S.orders[md.o]; const r = o.rentals.find((x) => x.id === md.r);
    r.stage = "out"; r.pickedUp = NOW; r.deposit.mode = md.dmode;
    if (r.deposit.amount) r.deposit.events.push({ type: md.dmode === "hold" ? "held" : "charged", at: NOW, amount: r.deposit.amount, method: md.method });
    hist(o, `${prod(r.pid).name} ${r.unit} picked up; deposit ${money(r.deposit.amount)} ${md.dmode === "hold" ? "held on card" : "charged by " + md.method.toLowerCase()}`); S.modal = null;
  },
  "return-ok"() {
    const md = S.modal; const o = S.orders[md.o]; const r = o.rentals.find((x) => x.id === md.r);
    r.stage = "returned"; r.returned = NOW;
    const last = r.deposit.events.filter((e) => e.type === "held" || e.type === "charged").pop();
    let dtext = "";
    if (last && last.type === "held") { r.deposit.events.push({ type: "released", at: NOW, amount: last.amount }); dtext = "hold released"; }
    if (last && last.type === "charged") {
      if (md.dep === "keep" && md.keep > 0) { r.deposit.events.push({ type: "kept", at: NOW, amount: md.keep }); if (md.keep < last.amount) r.deposit.events.push({ type: "refunded", at: NOW, amount: last.amount - md.keep }); dtext = `kept ${money(md.keep)}, refunded ${money(last.amount - md.keep)}`; }
      else { r.deposit.events.push({ type: "refunded", at: NOW, amount: last.amount }); dtext = "refunded"; }
    }
    hist(o, `${prod(r.pid).name} ${r.unit} returned${dtext ? "; deposit " + dtext : ""}`); S.modal = null;
  },
  "dep-ok"() {
    const md = S.modal; const o = S.orders[md.o]; const r = o.rentals.find((x) => x.id === md.r);
    if (md.topup) { md.topup.done = true; r.deposit.events.push({ type: "charged", at: NOW, amount: md.topup.amount, method: md.method }); hist(o, `Deposit top-up ${money(md.topup.amount)} by ${md.method.toLowerCase()}`); }
    else { r.deposit.events.push({ type: "charged", at: NOW, amount: r.deposit.amount, method: md.method }); hist(o, `Deposit ${money(r.deposit.amount)} by ${md.method.toLowerCase()}`); }
    S.modal = null;
  },
};

const CH = {
  dt(t) {
    const set = (cur) => (t.dataset.part === "date" ? t.value + "T" + cur.slice(11, 16) : cur.slice(0, 11) + t.value);
    if (t.dataset.k === "md-end") { const md = S.modal; md.end = set(md.end || addDays(S.orders[md.o].rentals.find((x) => x.id === md.r).end, 7)); md.amount = undefined; return; }
    const l = findLine(t.dataset.line); if (!t.value) return;
    l[t.dataset.k] = set(l[t.dataset.k]); l.over = {};
    if (P(l.end) <= P(l.start)) { l.end = addDays(l.start, 1); toast("Return moved to a day after pickup."); }
    if (l.unit !== "auto" && busyFor(l.unit, l.start, l.end, "draft" + l.id).length) { toast(`${l.unit} is booked then; set back to best fit.`); l.unit = "auto"; }
  },
  place(t) { S.draft[t.dataset.k] = t.value; },
  unit(t) { findLine(t.dataset.line).unit = t.value; },
  charged(t) { const l = findLine(t.dataset.line); const q = draftCalc(S.draft); const row = q.rows.find((r) => r.line === l); const list = row.periods[t.dataset.i].list; const v = baht(t.value); if (v <= 0) { toast("No zero price: use a coupon or Free on an extra."); return; } if (v === list) delete l.over[t.dataset.i]; else l.over[t.dataset.i] = { charged: v, reason: (l.over[t.dataset.i] || {}).reason || null }; },
  reason(t) { findLine(t.dataset.line).over[t.dataset.i].reason = t.value || null; },
  "add-extra"(t) { if (t.value) findLine(t.dataset.line).extras.push({ id: uid("E"), pid: t.value, qty: 1 }); },
  qty(t) { findLine(t.dataset.line).qty = Math.max(1, parseInt(t.value, 10) || 1); },
  "custom-text"(t) { findLine(t.dataset.line).text = t.value; },
  "custom-amt"(t) { findLine(t.dataset.line).amount = baht(t.value); },
  "coupon-in"(t) { S.draft.couponIn = t.value; },
  "draft-note"(t) { S.draft.note = t.value; return "skip"; },
  "order-note"(t) { S.orders[t.dataset.o].note = t.value; return "skip"; },
  newcust(t) { S.draft.newCust[t.dataset.k] = t.value; return "skip"; },
  depmode(t) { S.settings.depositMode = t.value; },
  "md-amount"(t) { S.modal.amount = baht(t.value); },
  "md-method"(t) { S.modal.method = t.value; },
  "md-of"(t) { S.modal.of = t.value; },
  "md-reason"(t) { S.modal.reason = t.value; },
  "md-text"(t) { S.modal.text = t.value; },
  "md-mode"(t) { S.modal.mode = t.value; S.modal.amount = undefined; if (t.value === "date" && !S.modal.end) { const r = S.orders[S.modal.o].rentals.find((x) => x.id === S.modal.r); S.modal.end = addDays(r.end, 7); } },
  "md-keep"(t) { S.modal.keep = t.checked; S.modal.amount = undefined; },
  "md-pid"(t) { S.modal.pid = t.value; S.modal.unit = null; },
  "md-unit"(t) { S.modal.unit = t.value; },
  "md-opt"(t) { S.modal.opt = t.value; },
  "md-manual"(t) { S.modal.manual = baht(t.value); },
  "md-mreason"(t) { S.modal.mreason = t.value; },
  "md-cheaper"(t) { S.modal.cheaper = t.value; },
  "md-repair"(t) { S.modal.repair = t.checked; },
  "md-dmode"(t) { S.modal.dmode = t.value; },
  "md-dep"(t) { S.modal.dep = t.value; },
  "md-keepamt"(t) { S.modal.keep = baht(t.value); },
  "set-swap"(t) { S.settings.swap[t.dataset.k] = t.checked; if (!S.settings.swap[S.modal.opt]) S.modal.opt = Object.keys(S.settings.swap).find((k) => S.settings.swap[k]) || "none"; },
  "set-cheaper"(t) { S.settings.cheaper[t.dataset.k] = t.checked; },
};

/* =====================================================================
   Wiring
   ===================================================================== */
function render() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, l]) => `<button role="tab" type="button" aria-selected="${S.tab === k}" data-act="tab" data-t="${k}">${l}</button>`).join("");
  const root = document.getElementById("root");
  if (S.tab === "a") root.innerHTML = shell("a", "new", renderNew("a"));
  if (S.tab === "b") root.innerHTML = shell("b", "order", renderOrder("b", S.orders.b));
  if (S.tab === "c") root.innerHTML = shell("c", "order", renderOrder("c", S.orders.c));
  if (S.tab === "d") root.innerHTML = `<div class="phones">
      <div class="phonecol"><b>a. New order at 375 px</b><div class="phoneframe" data-pf="pa"><div class="phonescroll">${shell("pa", "new", renderNew("pa"))}</div></div></div>
      <div class="phonecol"><b>b. Saved order at 375 px</b><div class="phoneframe" data-pf="pb"><div class="phonescroll">${shell("pb", "order", renderOrder("pb", S.orders.b))}</div></div></div>
    </div>`;
  // a dialog in a phone frame is drawn over the frame, not the page
  if (S.modal && (S.modal.frame === "pa" || S.modal.frame === "pb")) {
    const pf = root.querySelector(`[data-pf="${S.modal.frame}"]`); const ov = pf && pf.querySelector(".overlay"); if (ov) pf.appendChild(ov);
  }
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  // close open dropdowns when clicking elsewhere
  if (!e.target.closest(".search")) {
    let changed = false;
    if (S.draft.searchOpen) { S.draft.searchOpen = false; changed = true; }
    if (S.draft.custOpen) { S.draft.custOpen = false; changed = true; }
    if (changed && !t) { document.querySelectorAll("[data-res]").forEach((r) => (r.hidden = true)); }
  }
  if (!t) return;
  if (t.tagName === "A") e.preventDefault();
  const fn = ACT[t.dataset.act]; if (!fn) return;
  const f = frameOf(t) || (S.modal && S.modal.frame);
  const res = fn(t, f, e);
  if (res === "skip") return;
  clearTimeout(pending); pending = null;
  if (!/^menu$/.test(t.dataset.act)) Object.values(S.orders).forEach((o) => { if (t.dataset.act !== "menu") o.menu = false; });
  render();
});
// A text field's change fires on blur, often from the mousedown of a button click; re-rendering at once
// would replace that button before its click lands. So text fields re-render a moment later (or on the click).
let pending = null;
document.addEventListener("change", (e) => {
  const t = e.target.closest("[data-ch]"); if (!t) return;
  const fn = CH[t.dataset.ch]; if (!fn) return;
  if (fn(t) === "skip") return;
  const isText = t.tagName === "TEXTAREA" || (t.tagName === "INPUT" && !["radio", "checkbox", "date"].includes(t.type));
  if (!isText) { render(); return; }
  clearTimeout(pending); pending = setTimeout(() => { pending = null; render(); }, 300);
});
document.addEventListener("input", (e) => {
  const t = e.target.closest("[data-in]"); if (!t) return;
  const scope = t.closest("[data-frame]");
  if (t.dataset.in === "prod-q") { S.draft.search = t.value; S.draft.searchOpen = true; const r = scope.querySelector('[data-res="prod"]'); r.innerHTML = prodResults(); r.hidden = false; }
  if (t.dataset.in === "cust-q") { S.draft.custQ = t.value; S.draft.custOpen = true; const r = scope.querySelector('[data-res="cust"]'); r.innerHTML = custResults(); r.hidden = false; }
});
document.addEventListener("focusin", (e) => {
  const t = e.target.closest("[data-focus]"); if (!t) return;
  const scope = t.closest("[data-frame]");
  if (t.dataset.focus === "prod") { S.draft.searchOpen = true; const r = scope.querySelector('[data-res="prod"]'); r.innerHTML = prodResults(); r.hidden = false; }
  if (t.dataset.focus === "cust") { S.draft.custOpen = true; const r = scope.querySelector('[data-res="cust"]'); r.innerHTML = custResults(); r.hidden = false; }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.modal) { S.modal = null; render(); } });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.some(([k]) => k === h) && h !== S.tab) { S.tab = h; S.modal = null; render(); } });
(function start() { const h = location.hash.slice(1); if (TABS.some(([k]) => k === h)) S.tab = h; render(); })();
</script>
