<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon spike</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  button { font: inherit; padding: .6rem 1rem; margin: .25rem .5rem .25rem 0; cursor: pointer; }
  pre { background: #f4f4f4; padding: 1rem; overflow: auto; white-space: pre-wrap; }
</style>
<h1>Neon spike: sign-in test (row 6)</h1>
<p>Throwaway page. Sign in with each provider in turn; after each, this page shows what the database saw.</p>
<p>
  <button data-provider="line">Sign in with LINE</button>
  <button data-provider="google">Sign in with Google</button>
  <button id="out">Sign out</button>
</p>
<pre id="result">Checking for a session…</pre>
<script>
  const result = document.getElementById("result");
  for (const b of document.querySelectorAll("button[data-provider]")) {
    b.addEventListener("click", async () => {
      const res = await fetch("/api/auth/sign-in/social", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ provider: b.dataset.provider, callbackURL: "/", errorCallbackURL: "/?failed=1" }),
      });
      const data = await res.json().catch(() => ({}));
      if (data.url) location.href = data.url;
      else result.textContent = "Could not start sign-in: " + res.status + " " + JSON.stringify(data);
    });
  }
  document.getElementById("out").addEventListener("click", async () => {
    await fetch("/api/auth/sign-out", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
    location.href = "/";
  });
  (async () => {
    if (new URLSearchParams(location.search).has("error") || new URLSearchParams(location.search).has("failed")) {
      result.textContent = "Sign-in failed: " + location.search;
      return;
    }
    const res = await fetch("/api/row6");
    if (res.status === 401) { result.textContent = "Not signed in."; return; }
    result.textContent = "Signed in. What the database saw (tell Claude this ran; no need to copy it):\n\n" + JSON.stringify(await res.json(), null, 2);
  })();
</script>
</html>
